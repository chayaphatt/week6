<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset='utf-8'>
	<meta http-equiv='X-UA-Compatible' content='IE=edge'>
	<title>เข้าสู่ระบบสมาชิก | Member Login</title>
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<meta name="description" content="หน้าเข้าสู่ระบบสมาชิก สวยงาม ทันสมัย ใช้งานง่าย">
	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel='stylesheet' type='text/css' media='screen' href='main.css'>
	<script src='login.js'></script>
</head>
<body>
	<main class="page-wrapper login-mode">
		<form name="myLogin" id="myLogin">
			<fieldset>
				<!-- Form Header -->
				<header class="form-header">
					<div class="header-icon-wrapper" aria-hidden="true">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
							<polyline points="10 17 15 12 10 7"></polyline>
							<line x1="15" y1="12" x2="3" y2="12"></line>
						</svg>
					</div>
					<legend>เข้าสู่ระบบ</legend>
					<p class="form-subtitle">ยินดีต้อนรับกลับมา! กรุณากรอกข้อมูลของคุณ</p>
				</header>

				<!-- Friendly Hint when arrived from registration -->
				<div id="registeredHint" class="info-hint-box" style="display: none;" role="status">
					<span>✨ ได้รับข้อมูลบัญชีจากการลงทะเบียนแล้ว! กรุณากรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าสู่ระบบ</span>
				</div>

				<!-- Username Field -->
				<div class="form-group">
					<label for="username">ชื่อผู้ใช้ (Username)<span class="req-star">*</span></label>
					<div class="input-control">
						<span class="input-icon" aria-hidden="true">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<circle cx="12" cy="12" r="4"></circle>
								<path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path>
							</svg>
						</span>
						<input type="text" name="username" id="username" placeholder="กรอกชื่อผู้ใช้ของคุณ" required autocomplete="username">
					</div>
				</div>

				<!-- Password Field -->
				<div class="form-group">
					<label for="password">รหัสผ่าน (Password)<span class="req-star">*</span></label>
					<div class="input-control">
						<span class="input-icon" aria-hidden="true">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
								<path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
							</svg>
						</span>
						<input type="password" name="password" id="password" placeholder="กรอกรหัสผ่านของคุณ" required autocomplete="current-password">
					</div>
				</div>

				<!-- Action Buttons -->
				<div class="button-actions-group">
					<input type="submit" value="เข้าสู่ระบบ (Login)">
					<input type="reset" value="ล้างข้อมูล (Clear)">
				</div>

				<!-- Card Footer Link -->
				<div class="form-footer-divider"></div>
				<p class="switch-page-prompt">
					ยังไม่มีบัญชีผู้ใช้? <a href="index.html">สมัครสมาชิกที่นี่ (Register)</a>
				</p>
			</fieldset>
		</form>
	</main>

	<!-- Auto-detect registration query parameters -->
	<script>
		document.addEventListener('DOMContentLoaded', function() {
			try {
				var urlParams = new URLSearchParams(window.location.search);
				if (urlParams.get('username')) {
					var hintBox = document.getElementById('registeredHint');
					if (hintBox) {
						hintBox.style.display = 'flex';
					}
				}
			} catch (e) {
				console.error(e);
			}
		});
	</script>
</body>
</html>
